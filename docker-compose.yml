# Na serveru ovaj fajl automatski postavlja GitHub Actions (.github/workflows/deploy.yml)
# i koristi gotovu sliku iz GitHub Container Registry-ja.
# Ručno (na serveru, iz izvornog koda):  cp .env.example .env && docker compose up -d --build
services:
  app:
    image: ${IMAGE:-ghcr.io/antic-dev/fotograf:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
    volumes:
      - fotograf-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  fotograf-data:
  caddy-data:
  caddy-config:
